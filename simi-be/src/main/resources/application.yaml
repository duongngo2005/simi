spring:
  application:
    name: simi-be
  datasource:
    url: jdbc:mysql://localhost:3306/simi_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 65MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:thanhlykyguisimi@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000
  scheduler:
    daily-cron: "0 * * * * ?"
  vnpay:
    hash-secret: ${VNPAY_HASH_SECRET}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
    tmn-code: ${VNPAY_TMN_CODE}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.5-flash-lite

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:docidan7t}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


